<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo-list</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <h1>Список задач</h1>

  <form id="task-form" class="task-form">
    <input type="text" id="task-input" placeholder="Новая задача" autocomplete="off">
    <button type="submit">Добавить</button>
  </form>

  <p id="warning" class="warning"></p>

  <div class="filters">
    <button type="button" class="filter-btn active" data-filter="all">Все</button>
    <button type="button" class="filter-btn" data-filter="active">Активные</button>
    <button type="button" class="filter-btn" data-filter="completed">Завершённые</button>
  </div>

  <ul id="task-list" class="task-list"></ul>

  <p id="counter" class="counter"></p>
</main>

<script src="script.js" defer></script>
</body>
</html>
