<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1 class="game__title">Змейка</h1>
    <div id="score" class="game__score">Счёт: 0</div>

    <div class="game__field">
      <canvas id="game-canvas" width="400" height="400"></canvas>

      <div id="game-over" class="game-over hidden">
        <p class="game-over__title">Игра окончена</p>
        <p>Ваш счёт: <span id="final-score">0</span></p>
        <button id="restart-btn" class="game-over__btn" type="button">Начать заново</button>
      </div>
    </div>

    <p class="game__hint">Управление: стрелки ← ↑ → ↓</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
